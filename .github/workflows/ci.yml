name: Reproducibility checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Measure statement coverage
        run: PYTHONPATH=src python3 scripts/coverage_report.py

      - name: Run 30-execution benchmark
        run: PYTHONPATH=src python3 scripts/benchmark.py --runs 30

      - name: Build container
        run: docker build --tag fasd-cost-framework:ci .

      - name: Run tests in container
        run: docker run --rm fasd-cost-framework:ci
